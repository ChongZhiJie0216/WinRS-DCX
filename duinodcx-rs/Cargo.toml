[package]
name = "duinodcx-management"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "WinRS-DCX-Management"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
# No libudev: it cannot be cross-compiled for OpenWRT (musl); port listing falls back to sysfs.
serialport = { version = "4.3", default-features = false }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
rust-embed = "8.0"
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
